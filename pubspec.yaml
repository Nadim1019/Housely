name: housely
description: Production-grade offline-first Apartment Management Application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 2.5.1
  riverpod_annotation: 2.3.5
  drift: 2.16.0
  sqlite3_flutter_libs: 0.5.20
  path_provider: 2.1.2
  path: 1.9.1
  go_router: 13.2.0
  uuid: 4.3.3
  google_fonts: 6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 3.0.0
  build_runner: 2.4.13
  riverpod_generator: 2.4.0
  drift_dev: 2.16.0

dependency_overrides:
  frontend_server_client: 4.0.0

flutter:
  uses-material-design: true